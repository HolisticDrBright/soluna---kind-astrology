# Soluna — Supabase project config
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "soluna"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Adjust to your deployed app URL for production magic-link / OAuth redirects.
site_url = "http://localhost:8081"
additional_redirect_urls = ["rork-app://", "exp://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
# "oneshot" for fast local reloads; "per_worker" is closer to prod isolation.
policy = "oneshot"
inspector_port = 8083

# ─── Edge Functions ────────────────────────────────────────────────
# User-facing functions verify the Supabase Auth JWT automatically.
# Webhook + cron functions do their own auth (signature / cron secret),
# so JWT verification is disabled for them.

[functions.onboarding]
verify_jwt = true

[functions.blueprint]
verify_jwt = true

[functions.today]
verify_jwt = true

[functions.insight]
verify_jwt = true

[functions.synthesis]
verify_jwt = true

[functions.ask]
verify_jwt = true

[functions.connections]
verify_jwt = true

[functions.partner]
# Mixed auth: GET /partner/invite/:code is a public preview, the rest require a
# JWT (enforced in-handler). So JWT verification is off at the gateway.
verify_jwt = false

[functions.tarot]
verify_jwt = true

[functions.journal]
verify_jwt = true

[functions.rituals]
verify_jwt = true

[functions.saved]
verify_jwt = true

[functions.me]
verify_jwt = true

[functions.entitlements]
verify_jwt = true

[functions.billing-webhook]
verify_jwt = false

[functions.cron-daily-readings]
verify_jwt = false

[functions.cron-bond-readings]
verify_jwt = false

[functions.cron-drain-queue]
verify_jwt = false

[functions.cron-refresh-transits]
verify_jwt = false
